name: Frontend Syntax Check
on:
  pull_request:
    paths:
      - 'app.js'
      - '.github/workflows/frontend-syntax-check.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend JavaScript syntax
        run: node --check app.js
